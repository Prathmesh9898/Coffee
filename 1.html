<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coffee Website</title>

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: 'Poppins', sans-serif;
}

body{
    background:#5b1a1a;
    color:white;
}

/* Navbar */
.navbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 8%;
}

.logo{
    font-size:24px;
    font-weight:600;
}

.logo span{
    margin-right:8px;
}

.nav-links{
    list-style:none;
    display:flex;
    gap:40px;
}

.nav-links li a{
    text-decoration:none;
    color:white;
    font-weight:400;
    transition:0.3s;
}

.nav-links li a:hover{
    color:#ffb347;
}

/* Hero Section */
.hero{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:60px 8%;
    min-height:90vh;
}

.hero-text{
    max-width:550px;
}

.hero-text h4{
    color:#ff9f1c;
    font-size:22px;
    margin-bottom:15px;
}

.hero-text h1{
    font-size:42px;
    font-weight:700;
    margin-bottom:20px;
    line-height:1.3;
}

.hero-text p{
    font-size:16px;
    margin-bottom:30px;
    color:#f5f5f5;
}

.buttons{
    display:flex;
    gap:20px;
}

.btn{
    padding:12px 28px;
    border-radius:30px;
    font-weight:500;
    cursor:pointer;
    border:none;
    transition:0.3s;
}

.btn-primary{
    background:#ff9f1c;
    color:white;
}

.btn-primary:hover{
    background:#e68900;
}

.btn-outline{
    background:transparent;
    border:2px solid white;
    color:white;
}

.btn-outline:hover{
    background:white;
    color:#5b1a1a;
}

/* Hero Image */
.hero-image img{
    width:450px;
    max-width:100%;
}

/* Responsive */
@media(max-width:900px){
    .hero{
        flex-direction:column;
        text-align:center;
    }

    .hero-image{
        margin-top:40px;
    }
}
</style>
</head>

<body>

<!-- Navbar -->
<nav class="navbar">
    <div class="logo">
        ☕ Coffee
    </div>

    <ul class="nav-links">
    <li><a href="1.html">Home</a></li>
    <li><a href="about.html">About</a></li>

    <li><a href="menu.html" onclick="return checkLogin()">Menu</a></li>
    <li><a href="testimonial.html" onclick="return checkLogin()">Testimonials</a></li>
    <li><a href="gallery.html" onclick="return checkLogin()">Gallery</a></li>
    <li><a href="contact.html" onclick="return checkLogin()">Contact</a></li>

    <li><button onclick="logout()">Logout</button></li>
</ul>
</nav>

<!-- Hero Section -->
<section class="hero">

    <div class="hero-text">
        <h4>Best Coffee</h4>
        <h1>Make your day great with our special coffee!</h1>
        <p>
            Welcome to our coffee paradise, where every bean tells
            a story and every cup sparks joy.
        </p>

        
            <a href="login.html">
    <button class="btn btn-primary">Login</button>
    <button class="order-btn" onclick="window.location.href='login.html'">
</button>
            </a>

    
</div>        </div>
    </div>

    <div class="hero-image">
        <!-- Replace this image link with your coffee splash image -->
        <img src="coffee.png" alt="Coffee Cup">
    </div>

</section>

<script>
function logout(){
    localStorage.removeItem("isLoggedIn");
    window.location.href = "login.html";
}
</script>
<script>
function logout(){
    localStorage.removeItem("isLoggedIn");
    alert("Logged out!");
    window.location.href = "login.html";
}
</script>
</body>
</html>
