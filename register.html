<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coffee Register</title>
<style>
body{
    margin:0;
    padding:0;
    font-family: 'Poppins', sans-serif;
    background: url('https://images.unsplash.com/photo-1495474472287-4d71bcdd2085') no-repeat center/cover;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}
.register-box{
    background: rgba(0,0,0,0.8);
    padding:40px;
    border-radius:15px;
    width:320px;
    text-align:center;
    color:#fff;
}
.input-box{
    margin:12px 0;
    position:relative;
}
.input-box input{
    width:100%;
    padding:10px;
    border:none;
    border-radius:8px;
    outline:none;
}
.eye{
    position:absolute;
    right:10px;
    top:10px;
    cursor:pointer;
    color:#000;
}
button{
    width:100%;
    padding:10px;
    border:none;
    border-radius:8px;
    background:#c59d5f;
    color:#fff;
    cursor:pointer;
}
.error{
    color:red;
    font-size:13px;
    margin-top:5px;
}
</style>
</head>
<body>
<div class="register-box">
<h2>☕ Coffee Register</h2>
<form onsubmit="return registerUser()">
    
    <div class="input-box">
        <input type="text" id="full_name" placeholder="full_name" required>
    </div>
    <div class="input-box">
        <input type="email" id="email" placeholder="Email" required>
    </div>
    <div class="input-box">
        <input type="text" id="username" placeholder="Username" required>
    </div>
    <div class="input-box">
        <input type="password" id="password" placeholder="Password" required>
        <span class="eye" onclick="togglePassword('password')">👁</span>
    </div>
    <div class="input-box">
        <input type="password" id="confirm" placeholder="Confirm Password" required>
        <span class="eye" onclick="togglePassword('confirm')">👁</span>
    </div>
    <div class="error" id="errorMsg"></div>
<button type="submit">Register</button>
</form>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://aepsevbjbtizvyuhdrqv.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFlcHNldmJqYnRpenZ5dWhkcnF2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUzMjUxMDgsImV4cCI6MjEwMDkwMTEwOH0.qtMSwKVup2sVKWfvtUmDmA-KesuC25uGoquTFCEBPrs";
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function registerUser(){
    let email = document.getElementById("email").value.toLowerCase();
    let password = document.getElementById("password").value;
    let confirm = document.getElementById("confirm").value;

    if(!email.match(/^[a-z0-9._%+-]+@[a-z0-9.-]+\.(com|edu)$/)){
        alert("Only .com and .edu emails allowed ❌");
        return false;
    }
    if(password !== confirm){
        alert("Passwords do not match ❌");
        return false;
    }

    const { data, error } = await supabase.auth.signUp({
        email: email,
        password: password,
        options: {
            data: {
                full_name: document.getElementById("full_name").value,
                username: document.getElementById("username").value
            }
        }
    });

    if(error){
        alert("Error: " + error.message);
        return false;
    }

    alert("Registered successfully! ✅");
    window.location.href = "login.html";
    return false;
}

function togglePassword(id){
    let input = document.getElementById(id);
    input.type = input.type === "password" ? "text" : "password";
}
</script>
</body>
</html>
